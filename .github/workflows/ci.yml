name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate site files
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import sys
          from html.parser import HTMLParser
          from urllib.parse import unquote, urlsplit

          root = pathlib.Path.cwd()
          errors = []

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.targets = []

              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  key = "href" if tag == "a" else "src" if tag in {"img", "script", "source"} else None
                  if key and values.get(key):
                      self.targets.append(values[key])

          for path in root.rglob("*.html"):
              if any(part in {".git", "node_modules"} for part in path.parts):
                  continue
              text = path.read_text(encoding="utf-8")
              if "<!doctype html>" not in text.lower():
                  errors.append(f"{path}: missing DOCTYPE")
              parser = Links()
              parser.feed(text)
              for raw in parser.targets:
                  parsed = urlsplit(raw)
                  if parsed.scheme or parsed.netloc or raw.startswith(("#", "mailto:", "tel:", "data:", "javascript:")):
                      continue
                  target_text = unquote(parsed.path)
                  if not target_text:
                      continue
                  target = root / target_text.lstrip("/") if target_text.startswith("/") else path.parent / target_text
                  if not target.exists():
                      errors.append(f"{path}: missing local target {raw}")

          for path in root.rglob("*.json"):
              if any(part in {".git", "node_modules"} for part in path.parts):
                  continue
              try:
                  json.loads(path.read_text(encoding="utf-8"))
              except (OSError, UnicodeDecodeError, json.JSONDecodeError) as exc:
                  errors.append(f"{path}: invalid JSON: {exc}")

          if errors:
              print("Validation failed:", file=sys.stderr)
              print("\n".join(f"- {error}" for error in errors), file=sys.stderr)
              raise SystemExit(1)
          print("HTML structure, local references, and JSON are valid")
          PY

      - name: Report large files
        run: find . -type f -not -path './.git/*' -not -path './node_modules/*' -size +5M -print
