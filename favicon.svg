<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1119"/>
      <stop offset="100%" stop-color="#111620"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4b85c"/>
      <stop offset="100%" stop-color="#c8a84e"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="2" y="2" width="60" height="60" rx="14" ry="14" fill="url(#bg)" stroke="#1c212b" stroke-width="2"/>
  <!-- Large "4" numeral -->
  <text x="32" y="46" font-family="'Segoe UI', system-ui, sans-serif" font-size="36" font-weight="700" fill="url(#gold)" text-anchor="middle">4</text>
  <!-- Small "Y" above -->
  <text x="18" y="22" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="600" fill="#8b919e" text-anchor="middle">Y</text>
  <!-- Plus sign -->
  <text x="48" y="20" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="600" fill="#60a5fa" text-anchor="middle">+</text>
  <!-- Multiply sign -->
  <text x="48" y="50" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#34d399" text-anchor="middle">x</text>
  <!-- Minus sign -->
  <text x="16" y="54" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="600" fill="#a78bfa" text-anchor="middle">-</text>
</svg>
