<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1119"/>
      <stop offset="100%" stop-color="#111620"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4b85c"/>
      <stop offset="100%" stop-color="#c8a84e"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" ry="14" fill="url(#bg)" stroke="#1c212b" stroke-width="2"/>
  <!-- Large 4 -->
  <text x="32" y="46" font-family="'Segoe UI', system-ui, sans-serif" font-size="36" font-weight="700" fill="url(#gold)" text-anchor="middle">4</text>
  <!-- Y above -->
  <text x="18" y="22" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="600" fill="#8b919e" text-anchor="middle">Y</text>
  <!-- M for Maths (blue) -->
  <text x="48" y="18" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#60a5fa" text-anchor="middle">M</text>
  <!-- R for Reading (pink) -->
  <text x="48" y="30" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#f472b6" text-anchor="middle">R</text>
  <!-- E for English (teal) -->
  <text x="48" y="42" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#2dd4bf" text-anchor="middle">E</text>
  <!-- P for Prep (purple) -->
  <text x="16" y="54" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600" fill="#a78bfa" text-anchor="middle">P</text>
</svg>
